<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ödeme Yap - RotaCar</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .credit-card-form {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card-preview {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            position: relative;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .chip {
            width: 50px;
            height: 40px;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .chip::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background: #ccc;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-road me-2"></i>RotaCar</a>
        </div>
    </nav>

    <div class="container py-5">
        <div th:if="${error}" class="alert alert-danger text-center">
            <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${error}">Hata</span>
        </div>

        <div class="credit-card-form">
            <h3 class="text-center mb-4 fw-bold text-primary">Güvenli Ödeme</h3>

            <!-- Sanal Kart Görünümü -->
            <div class="card-preview shadow">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="chip border border-secondary border-opacity-25"></div>
                    <i class="fa-brands fa-cc-visa fa-2x opacity-75"></i>
                </div>
                <div>
                    <div class="fs-4 fw-bold mb-2" id="previewNo">#### #### #### ####</div>
                    <div class="d-flex justify-content-between">
                        <div>
                            <small class="opacity-75" style="font-size: 0.7em;">KART SAHİBİ</small>
                            <div class="fw-bold text-uppercase" id="previewAd">AD SOYAD</div>
                        </div>
                        <div>
                            <small class="opacity-75" style="font-size: 0.7em;">SKT</small>
                            <div class="fw-bold" id="previewSkt">MM/YY</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ödeme Formu -->
            <form action="/odeme-yap" method="POST" id="paymentForm">
                <input type="hidden" name="kiralamaIstegiJson" th:value="${kiralamaIstegiJson}" />

                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Kart Numarası</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white"><i
                                class="fa-regular fa-credit-card text-muted"></i></span>
                        <input type="text" class="form-control" id="kartNo" placeholder="0000 0000 0000 0000"
                            maxlength="19" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold small text-muted">Kart Üzerindeki İsim</label>
                    <input type="text" class="form-control text-uppercase" id="kartSahibi" placeholder="AD SOYAD"
                        required>
                </div>

                <div class="row">
                    <div class="col-6">
                        <label class="form-label fw-bold small text-muted">Son Kullanma (Ay/Yıl)</label>
                        <input type="text" class="form-control" id="skt" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label fw-bold small text-muted">CVV</label>
                        <div class="input-group">
                            <input type="text" class="form-control" id="cvv" placeholder="123" maxlength="3" required>
                            <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                        </div>
                    </div>
                </div>

                <div class="alert alert-info mt-3 small">
                    <i class="fa-solid fa-shield-halved me-1"></i> Ödemeniz 256-bit SSL sertifikası ile korunmaktadır.
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm mt-2">
                    <i class="fa-solid fa-lock me-2"></i> Ödemeyi Tamamla (<span th:text="${toplamTutar} + ' TL'">0
                        TL</span>)
                </button>
            </form>
        </div>
    </div>

    <!-- Scriptler -->
    <script>
        // Basit JS Formatlama ve Preview Güncelleme
        const kartNoInput = document.getElementById('kartNo');
        const previewNo = document.getElementById('previewNo');
        const kartSahibiInput = document.getElementById('kartSahibi');
        const previewAd = document.getElementById('previewAd');
        const sktInput = document.getElementById('skt');
        const previewSkt = document.getElementById('previewSkt');

        kartNoInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '').substring(0, 16);
            let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
            e.target.value = formatted;
            previewNo.textContent = formatted || '#### #### #### ####';
        });

        kartSahibiInput.addEventListener('input', function (e) {
            previewAd.textContent = e.target.value.toUpperCase() || 'AD SOYAD';
        });

        sktInput.addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '').substring(0, 4);
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            e.target.value = value;
            previewSkt.textContent = value || 'MM/YY';
        });
    </script>
</body>

</html>
