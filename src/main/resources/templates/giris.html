<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Giriş Yap - RotaCar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .card {
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border: none;
            background-color: rgba(255, 255, 255, 0.95);
        }

        .brand-logo {
            color: #0d6efd;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .brand-text {
            font-weight: 800;
            font-size: 1.8rem;
            color: #333;
            letter-spacing: -1px;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
        }

        .form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(90deg, #0d6efd 0%, #0056b3 100%);
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-road brand-logo"></i>
            <div class="brand-text">RotaCar</div>
            <p class="text-muted small mt-1">Yolculuğunuz burada başlar</p>
        </div>

        <h4 class="text-center mb-4 text-secondary">Giriş Yap</h4>

        <div th:if="${param.error}" class="alert alert-danger text-center">
            <i class="fa-solid fa-circle-exclamation me-1"></i> Kullanıcı adı veya şifre hatalı!
        </div>

        <div th:if="${param.cikis}" class="alert alert-success text-center">
            <i class="fa-solid fa-check-circle me-1"></i> Başarıyla çıkış yapıldı.
        </div>

        <form th:action="@{/giris}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold small text-muted">Email Adresi</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 rounded-start-3"><i
                            class="fa-solid fa-envelope text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0 ps-2" required
                        placeholder="ornek@mail.com" />
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold small text-muted">Şifre</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0 rounded-start-3"><i
                            class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0 ps-2" required
                        placeholder="******" />
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow-sm">
                Giriş Yap <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <span class="text-muted">Hesabın yok mu?</span>
            <a href="/kayit" class="text-decoration-none fw-bold ms-1">Kayıt Ol</a>
        </div>
    </div>

</body>

</html>
