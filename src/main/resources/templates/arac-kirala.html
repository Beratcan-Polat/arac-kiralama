<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Kiralama Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4>Rezervasyon Oluştur</h4>
            </div>
            <div class="card-body">

                <div class="alert alert-info">
                    <strong>Seçilen Araç:</strong> <span th:text="${arac.marka + ' ' + arac.model}"></span><br>
                    <strong>Günlük Fiyat:</strong> <span th:text="${arac.gunlukFiyat}"></span> TL
                </div>

                <div th:if="${hata}" class="alert alert-danger" th:text="${hata}"></div>

                <form th:action="@{/kiralama-yap}" th:object="${kiralamaIstegi}" method="post" id="reservationForm">
                    <input type="hidden" th:field="*{aracId}" />

                    <!-- Günlük Fiyatı JS'e taşımak için gizli alan -->
                    <input type="hidden" id="gunlukFiyat" th:value="${arac.gunlukFiyat}" />

                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="fw-bold">Alış Tarihi</label>
                            <input type="date" id="alisTarihi" name="alisTarihi" class="form-control"
                                th:value="${kiralamaIstegi.alisTarihi}" required />
                        </div>
                        <div class="col-6">
                            <label class="fw-bold">Alış Saati</label>
                            <input type="time" name="alisSaati" class="form-control"
                                th:value="${kiralamaIstegi.alisSaati}" required />
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-6">
                            <label class="fw-bold">İade Tarihi</label>
                            <input type="date" id="iadeTarihi" name="iadeTarihi" class="form-control"
                                th:value="${kiralamaIstegi.iadeTarihi}" required />
                        </div>
                        <div class="col-6">
                            <label class="fw-bold">İade Saati</label>
                            <input type="time" name="iadeSaati" class="form-control"
                                th:value="${kiralamaIstegi.iadeSaati}" required />
                        </div>
                    </div>

                    <!-- Özet Hesaplama Alanı -->
                    <div id="fiyatOzeti" class="alert alert-secondary d-none">
                        <div class="d-flex justify-content-between">
                            <span>Gün Sayısı:</span>
                            <span class="fw-bold" id="gunSayisiSpan">0 Gün</span>
                        </div>
                        <div class="d-flex justify-content-between mt-2">
                            <span>Toplam Tutar:</span>
                            <span class="fw-bold text-success fs-5" id="toplamTutarSpan">0 TL</span>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" name="odemeDurumu" value="OFISTE" class="btn btn-warning btn-lg fw-bold"
                            id="btnOfiste">
                            <i class="fa-solid fa-wallet me-2"></i> Ofiste Öde | <span
                                class="tutar-text">Hesaplanıyor...</span>
                        </button>

                        <button type="submit" name="odemeDurumu" value="ONLINE" class="btn btn-success btn-lg fw-bold"
                            id="btnOnline">
                            <i class="fa-solid fa-credit-card me-2"></i> Şimdi Öde | <span
                                class="tutar-text">Hesaplanıyor...</span>
                        </button>
                    </div>

                    <a href="/araclar" class="btn btn-light w-100 mt-3 text-muted">İptal Et</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const alisInput = document.getElementById("alisTarihi");
            const iadeInput = document.getElementById("iadeTarihi");
            const gunlukFiyat = parseFloat(document.getElementById("gunlukFiyat").value);

            const btnOfiste = document.getElementById("btnOfiste");
            const btnOnline = document.getElementById("btnOnline");
            const ozetDiv = document.getElementById("fiyatOzeti");
            const gunSayisiSpan = document.getElementById("gunSayisiSpan");
            const toplamTutarSpan = document.getElementById("toplamTutarSpan");

            function hesapla() {
                const alisVal = alisInput.value;
                const iadeVal = iadeInput.value;

                if (alisVal && iadeVal) {
                    const date1 = new Date(alisVal);
                    const date2 = new Date(iadeVal);

                    // Zaman farkı (ms cinsinden)
                    const diffTime = date2 - date1;
                    // Gün farkı (1 gün = 1000 * 60 * 60 * 24 ms)
                    // Min 1 gün sayıyoruz
                    let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                    if (diffDays < 1) diffDays = 1; // Aynı gün iade olsa bile 1 gün
                    if (date2 < date1) diffDays = 0; // Hatalı tarih

                    if (diffDays > 0) {
                        const toplam = diffDays * gunlukFiyat;
                        const indirimliToplam = toplam * 0.70;

                        // Buton metinlerini güncelle
                        updateButtonText(btnOfiste, "Ofiste Öde", toplam);
                        updateButtonText(btnOnline, "Şimdi Öde", indirimliToplam);

                        // Özeti göster
                        ozetDiv.classList.remove("d-none");
                        gunSayisiSpan.textContent = diffDays + " Gün";
                        toplamTutarSpan.textContent = formatCurrency(toplam);

                        // Butonları aktif et
                        btnOfiste.disabled = false;
                        btnOnline.disabled = false;
                    } else {
                        resetButtons();
                        ozetDiv.classList.add("d-none");
                    }
                } else {
                    resetButtons();
                    ozetDiv.classList.add("d-none");
                }
            }

            function updateButtonText(btn, label, amount) {
                const formatted = formatCurrency(amount);
                // Span içini güncellemek yerine direkt HTML basabiliriz veya span'ı buluruz
                // Basitçe:
                const span = btn.querySelector(".tutar-text");
                if (span) span.textContent = formatted;
            }

            function formatCurrency(amount) {
                return new Intl.NumberFormat('tr-TR', { style: 'currency', currency: 'TRY' }).format(amount);
            }

            function resetButtons() {
                const spanOfis = btnOfiste.querySelector(".tutar-text");
                const spanOnline = btnOnline.querySelector(".tutar-text");
                if (spanOfis) spanOfis.textContent = "- TL";
                if (spanOnline) spanOnline.textContent = "- TL";

                // Tarih seçilmeden basılamasın
                // btnOfiste.disabled = true; // İsterseniz kapatabilirsiniz
                // btnOnline.disabled = true;
            }

            alisInput.addEventListener("change", hesapla);
            iadeInput.addEventListener("change", hesapla);

            // İlk açılışta hesapla (eğer dolu gelmişse)
            hesapla();
        });
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

</body>

</html>
