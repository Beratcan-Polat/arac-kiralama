<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Fiyat Politikaları</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="container p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fa-solid fa-tags text-primary"></i> Fiyat Politikaları</h2>
            <a href="/admin/panel" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> Panele
                Dön</a>
        </div>

        <!-- Mesajlar -->
        <div th:if="${mesaj}" class="alert alert-success alert-dismissible fade show">
            <i class="fa-solid fa-check-circle me-2"></i> <span th:text="${mesaj}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${hata}" class="alert alert-danger alert-dismissible fade show">
            <i class="fa-solid fa-circle-exclamation me-2"></i> <span th:text="${hata}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row">
            <!-- Mevcut Politikalar -->
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white fw-bold">
                        <i class="fa-solid fa-list me-2"></i> Tanımlı Araç Sınıfı Kısıtlamaları
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover mb-0 align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th>Araç Sınıfı</th>
                                    <th>Min. Fiyat (TL)</th>
                                    <th>Max. Fiyat (TL)</th>
                                    <th class="text-end">İşlem</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:if="${politikalar.empty}">
                                    <td colspan="4" class="text-center py-4 text-muted">Henüz hiç politika
                                        tanımlanmamış.</td>
                                </tr>
                                <tr th:each="politika : ${politikalar}">
                                    <form action="/admin/politika-guncelle" method="post">
                                        <input type="hidden" name="id" th:value="${politika.id}">
                                        <td class="fw-bold" th:text="${politika.aracSinifi}">Ekonomi</td>
                                        <td>
                                            <input type="number" step="0.01" class="form-control form-control-sm"
                                                name="minFiyat" th:value="${politika.minFiyat}" style="width: 100px;">
                                        </td>
                                        <td>
                                            <input type="number" step="0.01" class="form-control form-control-sm"
                                                name="maxFiyat" th:value="${politika.maxFiyat}" style="width: 100px;">
                                        </td>
                                        <td class="text-end">
                                            <button type="submit" class="btn btn-sm btn-primary"><i
                                                    class="fa-solid fa-save"></i> Kaydet</button>
                                            <a th:href="@{/admin/politika-sil/{id}(id=${politika.id})}"
                                                onclick="return confirm('Silmek istediğinize emin misiniz?')"
                                                class="btn btn-sm btn-outline-danger ms-1"><i
                                                    class="fa-solid fa-trash"></i></a>
                                        </td>
                                    </form>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Yeni Politika Ekleme -->
            <div class="col-md-4">
                <div class="card shadow-sm border-success">
                    <div class="card-header bg-success text-white fw-bold">
                        <i class="fa-solid fa-plus me-2"></i> Yeni Politika Ekle
                    </div>
                    <div class="card-body">
                        <form action="/admin/politika-ekle" method="post">
                            <div class="mb-3">
                                <label class="form-label">Araç Sınıfı (Örn: Lüks)</label>
                                <input type="text" class="form-control" name="aracSinifi" required>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">Min Fiyat</label>
                                    <input type="number" step="0.01" class="form-control" name="minFiyat"
                                        placeholder="0.00">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Max Fiyat</label>
                                    <input type="number" step="0.01" class="form-control" name="maxFiyat"
                                        placeholder="0.00">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-check"></i>
                                Politikayı Oluştur</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
