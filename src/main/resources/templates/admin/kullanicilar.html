<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Kullanıcı Listesi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-light">

    <div class="d-flex">
        <!-- Sidebar için basit bir placeholder veya include yapılabilir, şimdilik manuel ekliyorum veya sadece geri dön butonu -->

        <div class="container p-5">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2><i class="fa-solid fa-users text-primary"></i> Kayıtlı Kullanıcılar</h2>
                <a href="/admin/panel" class="btn btn-outline-secondary"><i class="fa-solid fa-arrow-left"></i> Panele
                    Dön</a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>#ID</th>
                                <th>Ad Soyad</th>
                                <th>E-Posta</th>
                                <th>Rol</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="kullanici : ${kullanicilar}">
                                <td th:text="${kullanici.id}">1</td>
                                <td class="fw-bold" th:text="${kullanici.ad}">Ad Soyad</td>
                                <td th:text="${kullanici.email}">email@example.com</td>
                                <td>
                                    <form action="/admin/rol-guncelle" method="post" style="max-width: 150px;">
                                        <input type="hidden" name="userId" th:value="${kullanici.id}" />
                                        <select name="rol" class="form-select form-select-sm"
                                            onchange="this.form.submit()">
                                            <option th:each="r : ${T(com.arackiralama.model.Rol).values()}"
                                                th:value="${r}" th:text="${r}" th:selected="${r == kullanici.rol}">
                                            </option>
                                        </select>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
