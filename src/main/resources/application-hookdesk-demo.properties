# Yalnızca infra/hookdesk/compose.yaml ile kullanılan ayrı demo veritabanı.
spring.datasource.url=jdbc:mysql://mysql:3306/rental_hookdesk_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=rental_demo
spring.datasource.password=${RENTAL_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.datasource.hikari.maximum-pool-size=5
server.port=8080
server.servlet.session.cookie.name=RENTAL_DEMO_SESSION
jwt.secret=${RENTAL_JWT_SECRET}
mail.service.url=http://mail-legacy:8080
gemini.api.key=
hookdesk.demo.email=musteri@example.com
hookdesk.demo.password=${RENTAL_DEMO_PASSWORD}
logging.level.root=WARN
logging.level.com.arackiralama=INFO
