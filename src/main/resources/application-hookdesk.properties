# Activate with --spring.profiles.active=hookdesk after configuring the existing database/auth settings.
hookdesk.enabled=${HOOKDESK_ENABLED:false}
hookdesk.base-url=${HOOKDESK_BASE_URL:}
hookdesk.api-key=${HOOKDESK_API_KEY:}
hookdesk.poll-delay-ms=${HOOKDESK_POLL_DELAY_MS:2000}
hookdesk.scheduling-enabled=${HOOKDESK_SCHEDULING_ENABLED:true}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
